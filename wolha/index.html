<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07070d">
<title>월하검객</title>
<style>
  :root { --bg:#07070d; --fg:#e8e2d0; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    font-family:"Galmuri11","NeoDunggeunmo","DungGeunMo","Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  #touch { position:fixed; left:0; right:0; bottom:0; display:none; justify-content:space-between; align-items:flex-end;
    padding:12px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    pointer-events:none; }
  #touch .pad { display:grid; gap:8px; pointer-events:auto; }
  #touch .dpad { grid-template-columns:repeat(3,min(56px,13.5vw)); grid-template-rows:repeat(2,min(56px,13.5vw)); gap:6px; }
  #touch .btns { grid-template-columns:repeat(3,min(62px,14.5vw)); grid-template-rows:repeat(2,min(56px,13.5vw)); gap:6px; }
  #touch button { border:2px solid #e8e2d066; background:#e8e2d01c; color:var(--fg); border-radius:12px;
    font:inherit; font-size:15px; font-weight:bold; touch-action:none; padding:0; }
  #touch button.on { background:#ffd84a66; border-color:#ffd84a; }
  #touch button[data-k=guard] { border-color:#9fe8ff88; }
  #touch button[data-k=heavy] { border-color:#ff8a5b88; }
  body.touch #touch { display:flex; }
  #menuBtn { position:fixed; top:calc(8px + env(safe-area-inset-top)); right:calc(8px + env(safe-area-inset-right));
    width:40px; height:40px; display:none; border:2px solid #e8e2d055; background:#00000055; color:var(--fg);
    border-radius:10px; font-size:16px; touch-action:none; }
  body.touch.fighting #menuBtn { display:block; }
  @media (orientation:landscape) {
    #touch { opacity:0.8; }
    #touch .dpad { grid-template-columns:repeat(3,52px); grid-template-rows:repeat(2,52px); }
    #touch .btns { grid-template-columns:repeat(3,58px); grid-template-rows:repeat(2,52px); }
    #touch button { background:#0008; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen"></canvas></div>
<button id="menuBtn">☰</button>
<div id="touch">
  <div class="pad dpad">
    <span></span><button data-k="dodge">회피</button><span></span>
    <button data-k="left">◀</button><button data-k="down">하단</button><button data-k="right">▶</button>
  </div>
  <div class="pad btns">
    <span></span><span></span><button data-k="start">확인</button>
    <button data-k="light">베기</button><button data-k="heavy">강타</button><button data-k="guard">막기</button>
  </div>
</div>
<script>
'use strict';
// ================================================================
//  월하검객 (月下劍客) — 레트로 픽셀 검객 대전
// ================================================================
const W = 384, H = 216, GROUND = 186;
const PARRY = 7;             // 막기 버튼을 누른 직후 이 프레임 안에 맞으면 받아넘기기(패리)
const PARRY_LOCK = 20;       // 막기 연타 방지: 이 프레임 안에 다시 누르면 패리 판정 없음
const ROUND_TIME = 60;

const ATK = {
  light: { type:'light', windup:9,  active:4, recover:13, range:40, dmg:9,  ki:8,  guardKi:14, lunge:1.4, stun:16 },
  heavy: { type:'heavy', windup:22, active:5, recover:24, range:47, dmg:22, ki:18, guardKi:42, lunge:2.4, stun:26 },
};

// ---------------------------------------------------------------- 화면
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const g = buf.getContext('2d');
let S = 3;
function resize() {
  const touch = document.body.classList.contains('touch');
  const portrait = window.innerHeight > window.innerWidth;
  const availH = window.innerHeight - (touch && portrait ? 170 : 0);
  S = Math.max(1, Math.min(Math.floor(window.innerWidth / W), Math.floor(availH / H)));
  if (S < 2) S = Math.max(1, Math.min(window.innerWidth / W, availH / H));
  cv.width = Math.round(W * S); cv.height = Math.round(H * S);
  ctx.imageSmoothingEnabled = false;
  const wrap = document.getElementById('wrap');
  wrap.style.alignItems = touch && portrait ? 'flex-start' : 'center';
  wrap.style.paddingTop = touch && portrait ? 'calc(24px + env(safe-area-inset-top))' : '0';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('gesturestart', e => e.preventDefault());   // iOS 핀치 줌 방지
document.addEventListener('dblclick', e => e.preventDefault());

const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// 고해상도 텍스트(한글 가독성) — 좌표는 저해상도 기준
function text(str, x, y, size = 8, color = '#e8e2d0', align = 'left', shadow = '#000') {
  ctx.font = `bold ${Math.round(size * S)}px "Galmuri11","NeoDunggeunmo","Malgun Gothic","Apple SD Gothic Neo",sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'top';
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(str, Math.round((x + 0.6) * S), Math.round((y + 0.6) * S)); }
  ctx.fillStyle = color; ctx.fillText(str, Math.round(x * S), Math.round(y * S));
}

// ---------------------------------------------------------------- 사운드
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(freq, dur, type = 'square', vol = 0.08, slide = 0) {
  if (!AC) return; const t = AC.currentTime;
  const o = AC.createOscillator(), v = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(v).connect(AC.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol = 0.1, hp = 800) {
  if (!AC) return; const t = AC.currentTime;
  const b = AC.createBuffer(1, Math.floor(AC.sampleRate * dur), AC.sampleRate);
  const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const v = AC.createGain(); v.gain.value = vol;
  s.connect(f).connect(v).connect(AC.destination); s.start(t);
}
const SFX = {
  swing: () => noise(0.09, 0.05, 2500),
  heavy: () => { noise(0.16, 0.07, 1200); tone(140, 0.15, 'sawtooth', 0.03, -60); },
  clash: () => { tone(1800, 0.12, 'square', 0.05, -400); noise(0.08, 0.08, 3000); },
  parry: () => { tone(2400, 0.08, 'square', 0.06); setTimeout(() => tone(3200, 0.25, 'triangle', 0.07), 50); noise(0.1, 0.06, 4000); },
  hit:   () => { noise(0.18, 0.14, 300); tone(90, 0.18, 'square', 0.08, -40); },
  crit:  () => { noise(0.3, 0.16, 200); tone(70, 0.35, 'sawtooth', 0.1, -30); tone(1600, 0.3, 'triangle', 0.05, -900); },
  brk:   () => { tone(300, 0.25, 'sawtooth', 0.08, -200); noise(0.2, 0.08, 600); },
  dodge: () => noise(0.06, 0.04, 5000),
  feint: () => tone(500, 0.06, 'triangle', 0.05, 200),
  select:() => tone(880, 0.05, 'square', 0.05),
  go:    () => { tone(440, 0.12, 'square', 0.06); setTimeout(() => tone(880, 0.25, 'square', 0.06), 120); },
  gong:  () => { tone(110, 1.4, 'sine', 0.2, -20); tone(220, 1.0, 'triangle', 0.06, -30); },
};

// ---------------------------------------------------------------- 입력
const keys = {}, pressed = {};
const KEYMAP_1P = { left:['KeyA','ArrowLeft'], right:['KeyD','ArrowRight'], down:['KeyS','ArrowDown'], up:['KeyW','ArrowUp'],
  light:['KeyJ','KeyZ'], heavy:['KeyK','KeyX'], guard:['KeyL','KeyC'], dodge:['Space','KeyI'] };
const KEYMAP_VS1 = { left:['KeyA'], right:['KeyD'], down:['KeyS'], up:['KeyW'], light:['KeyF'], heavy:['KeyG'], guard:['KeyH'], dodge:['KeyW'] };
const KEYMAP_VS2 = { left:['ArrowLeft'], right:['ArrowRight'], down:['ArrowDown'], up:['ArrowUp'], light:['Comma','Numpad1'], heavy:['Period','Numpad2'], guard:['Slash','Numpad3'], dodge:['ArrowUp'] };
window.addEventListener('keydown', e => {
  audio();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// 터치
const touchState = {}, touchPressed = {};
const IS_TOUCH = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (IS_TOUCH) document.body.classList.add('touch');
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); audio(); if (!touchState[k]) touchPressed[k] = true; touchState[k] = true; b.classList.add('on'); };
  const off = e => { e.preventDefault(); touchState[k] = false; b.classList.remove('on'); };
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
// 메뉴 버튼(전투 중 나가기) & 화면 탭으로 메뉴 조작
let tapAt = null;
document.getElementById('menuBtn').addEventListener('pointerdown', e => { e.preventDefault(); pressed.Escape = true; });
cv.addEventListener('pointerdown', e => {
  audio();
  const r = cv.getBoundingClientRect();
  tapAt = { x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H };
});
resize();

const held = (map, a) => map[a].some(c => keys[c]) || (map === KEYMAP_1P && touchState[a]);
const hit_ = (map, a) => map[a].some(c => pressed[c]) || (map === KEYMAP_1P && touchPressed[a]);
const menuUp = () => pressed.ArrowUp || pressed.KeyW;
const menuDown = () => pressed.ArrowDown || pressed.KeyS || touchPressed.down;
const menuOk = () => tapAt || pressed.Enter || pressed.KeyJ || pressed.KeyZ || pressed.Space || touchPressed.start || touchPressed.light;
const menuBack = () => pressed.Escape || pressed.Backspace;

function readHuman(map, f) {
  const fwdKey = f.dir > 0 ? 'right' : 'left', backKey = f.dir > 0 ? 'left' : 'right';
  return {
    fwd: held(map, fwdKey), back: held(map, backKey), down: held(map, 'down'),
    guard: held(map, 'guard'), guardP: hit_(map, 'guard'),
    lightP: hit_(map, 'light'), heavyP: hit_(map, 'heavy'), dodgeP: hit_(map, 'dodge'),
  };
}

// ---------------------------------------------------------------- 상대(무사수행)
const PAL = (gi, hakama, band, hair = '#1a1410', skin = '#e8b98a') => ({ gi, hakama, band, hair, skin });
const OPPONENTS = [
  { name:'돌쇠', title:'시골 도장 견습생', quote:'사부님이 이기면 밥 두 그릇 준댔어!',
    pal:PAL('#b7a57a','#5a4a32','#c0392b'), speed:0.9, react:34, jitter:10, parry:0.0, block:0.25, dodge:0.05, read:0.4,
    punish:0.15, aggro:0.25, heavyPref:0.45, lowMix:0.1, feint:0, adapt:false, precision:4, think:22, sky:0 },
  { name:'무명', title:'떠돌이 낭인', quote:'이름 따윈 버렸다. 남은 건 칼뿐.',
    pal:PAL('#4a5560','#2a2e35','#8a8a8a'), speed:1.0, react:26, jitter:8, parry:0.05, block:0.4, dodge:0.08, read:0.55,
    punish:0.35, aggro:0.35, heavyPref:0.35, lowMix:0.3, feint:0, adapt:false, precision:3, think:18, sky:1 },
  { name:'청운', title:'청풍도장 사범', quote:'기본이 곧 오의다. 보여주마.',
    pal:PAL('#e6e6e6','#1f3a6b','#2e86de'), speed:1.0, react:20, jitter:6, parry:0.15, block:0.55, dodge:0.05, read:0.7,
    punish:0.6, aggro:0.4, heavyPref:0.3, lowMix:0.4, feint:0.05, adapt:false, precision:3, think:15, sky:2 },
  { name:'야영', title:'그림자 자객', quote:'……보이지도 않을 것이다.',
    pal:PAL('#22222e','#14141c','#6c3483','#0c0c10','#c9a27a'), speed:1.3, react:18, jitter:6, parry:0.1, block:0.3, dodge:0.3, read:0.65,
    punish:0.65, aggro:0.7, heavyPref:0.15, lowMix:0.55, feint:0.2, adapt:false, precision:3, think:10, sky:3 },
  { name:'강철', title:'철벽의 수문장', quote:'내 방어를 뚫은 자는 없다.',
    pal:PAL('#7b4a2a','#3b2414','#d4ac0d','#2b1a0e'), speed:0.85, react:16, jitter:5, parry:0.2, block:0.7, dodge:0.0, read:0.8,
    punish:0.7, aggro:0.3, heavyPref:0.7, lowMix:0.35, feint:0.1, adapt:false, precision:2, think:16, sky:4 },
  { name:'홍련', title:'붉은 연꽃의 검귀', quote:'춤추듯 베어주지. 따라올 수 있다면.',
    pal:PAL('#a93226','#3d0c0c','#f5b7b1','#2a0a0a','#f0c8a0'), speed:1.15, react:13, jitter:4, parry:0.35, block:0.45, dodge:0.12, read:0.85,
    punish:0.85, aggro:0.55, heavyPref:0.4, lowMix:0.5, feint:0.3, adapt:true, precision:2, think:10, sky:5 },
  { name:'백야', title:'달빛 아래의 검성', quote:'네 칼이 무엇을 말하는지, 이미 들었다.',
    pal:PAL('#f2f3f4','#5d6d7e','#f4d03f','#d5d8dc','#ecc9a0'), speed:1.1, react:10, jitter:3, parry:0.55, block:0.35, dodge:0.08, read:0.9,
    punish:1.0, aggro:0.5, heavyPref:0.45, lowMix:0.5, feint:0.35, adapt:true, precision:1, think:9, sky:6 },
];
const PLAYER_PAL = PAL('#2c3e70','#151b2e','#e74c3c');
const P2_PAL = PAL('#6e2c2c','#2a1212','#f1c40f');
const DUMMY = { name:'목인', title:'수련용 허수아비 (공격만 함)', pal:PAL('#a0784a','#6b4a2a','#3b2a1a','#3b2a1a','#c8a070'),
  speed:0.8, react:99, jitter:0, parry:0, block:0, dodge:0, read:0, punish:0, aggro:0.5, heavyPref:0.4, lowMix:0.5, feint:0, adapt:false, precision:0, think:30, sky:2, dummy:true };

// ---------------------------------------------------------------- 검객
let frame = 0;
class Fighter {
  constructor(x, dir, pal, speed = 1) {
    this.x = x; this.dir = dir; this.pal = pal; this.speed = speed;
    this.hp = 100; this.ki = 100; this.kiDelay = 0;
    this.state = 'idle'; this.t = 0; this.dur = 0;
    this.atk = null; this.height = 'high'; this.atkId = 0; this.hitDone = false;
    this.gh = 'high'; this.gtime = 99; this.lastGuard = -999;
    this.ripo = 0; this.kb = 0; this.buf = null; this.flash = 0;
    this.stats = { parry:0, ripo:0, hits:0, blocks:0, feints:0 };
  }
  set(state, dur = 0) { this.state = state; this.t = 0; this.dur = dur; }
  canAct() { return this.state === 'idle' || this.state === 'walk' || this.state === 'guard'; }
  spendKi(n) { this.ki = Math.max(0, this.ki - n); this.kiDelay = 40; }

  update(inp) {
    this.t++;
    if (this.ripo > 0) this.ripo--;
    if (this.kiDelay > 0) this.kiDelay--;
    if (this.flash > 0) this.flash--;
    if (inp.lightP) this.buf = { type:'light', low:inp.down, age:0 };
    if (inp.heavyP) this.buf = { type:'heavy', low:inp.down, age:0 };
    if (this.buf && ++this.buf.age > 8) this.buf = null;

    switch (this.state) {
      case 'idle': case 'walk': case 'guard': {
        if (inp.dodgeP && this.ki >= 12) {
          this.spendKi(12); this.set('dodge'); this.vx = 3.2; SFX.dodge(); this.buf = null; break;
        }
        if (this.buf && this.ki > 0) {
          const a = ATK[this.buf.type];
          this.atk = a; this.height = this.buf.low ? 'low' : 'high'; this.atkId++;
          this.spendKi(a.ki); this.set('windup'); this.buf = null; break;
        }
        if (inp.guard && this.ki > 0) {
          const h = inp.down ? 'low' : 'high';
          if (this.state !== 'guard' || h !== this.gh) {
            // 새로 막기를 눌렀거나 상/하단을 바꿨다 → 패리 판정 시작 (연타 시 무효)
            this.gtime = (frame - this.lastGuard < PARRY_LOCK) ? PARRY + 1 : 0;
            this.lastGuard = frame; this.gh = h;
          }
          if (this.state !== 'guard') this.t = 0;
          this.state = 'guard'; this.gtime++;
          break;
        }
        const sp = this.speed;
        let vx = 0;
        if (inp.fwd) vx = 1.1 * sp; else if (inp.back) vx = -0.85 * sp;
        this.x += vx * this.dir;
        const ns = vx ? 'walk' : 'idle';
        if (ns !== this.state) { this.state = ns; this.t = 0; }
        break;
      }
      case 'windup':
        if (this.atk.type === 'heavy' && inp.guardP && this.t < this.atk.windup - 3 && this.ki >= 6) {
          this.spendKi(6); this.set('idle'); this.stats.feints++; SFX.feint(); this.feintFx = 20; break;
        }
        if (this.t >= this.atk.windup) {
          this.set('active'); this.hitDone = false;
          (this.atk.type === 'heavy' ? SFX.heavy : SFX.swing)();
        }
        break;
      case 'active':
        this.x += this.atk.lunge * this.dir * (1 - this.t / (this.atk.active + 1));
        if (this.t >= this.atk.active) this.set('recover');
        break;
      case 'recover':
        if (this.t >= this.atk.recover) this.set('idle');
        break;
      case 'dodge':
        this.x -= this.vx * this.dir; this.vx *= 0.86;
        if (this.t >= 16) this.set('idle');
        break;
      case 'block':
        this.x -= this.kb * this.dir; this.kb *= 0.75;
        if (this.t >= this.dur) {
          if (inp.guard && this.ki > 0) { this.state = 'guard'; this.t = 0; this.gtime = PARRY + 1; this.gh = inp.down ? 'low' : 'high'; }
          else this.set('idle');
        }
        break;
      case 'parry': case 'hit': case 'stagger': case 'guardbreak':
        this.x -= this.kb * this.dir; this.kb *= 0.8;
        if (this.t >= this.dur) this.set('idle');
        break;
      case 'dead':
        this.x -= this.kb * this.dir; this.kb *= 0.9;
        break;
    }
    if (this.feintFx) this.feintFx--;
    // 기력 회복
    if (this.kiDelay <= 0 && (this.state === 'idle' || this.state === 'walk')) this.ki = Math.min(100, this.ki + 0.5);
    else if (this.state === 'guard' && this.kiDelay <= 0) this.ki = Math.min(100, this.ki + 0.1);
  }
  invuln() { return this.state === 'dodge' && this.t <= 10; }
}

// ---------------------------------------------------------------- CPU 인공지능
class AI {
  constructor(p) {
    this.p = p; this.f = 0; this.seenAtk = 0; this.reactAt = -1;
    this.gStart = -1; this.gUntil = -1; this.gH = 'high';
    this.attackAt = -1; this.attackType = 'light'; this.attackLow = false; this.feintAt = -1;
    this.nextThink = 0; this.move = 0; this.punished = false; this.recSeen = 0;
    this.memory = { high:1, low:1 };
  }
  guessHeight(op) {
    if (Math.random() < this.p.read) return op.height;
    if (this.p.adapt) return this.memory.high >= this.memory.low ? 'high' : 'low';
    return Math.random() < 0.5 ? 'high' : 'low';
  }
  think(me, op) {
    const p = this.p; this.f++;
    const inp = { fwd:0, back:0, down:0, guard:0, guardP:0, lightP:0, heavyP:0, dodgeP:0 };
    const d = Math.abs(me.x - op.x);
    if (me.state === 'dead' || op.state === 'dead') return inp;

    // 1) 상대의 공격 시작을 '본다' (반응속도만큼 늦게)
    if (op.state === 'windup' && op.atkId !== this.seenAtk) {
      this.seenAtk = op.atkId;

// ---------------------------------------------------------------- 게임 흐름
let scene = 'title', menuIdx = 0, mode = 'story', stage = 0;
let p1, p2, ai1 = null, ai2 = null, round = 1, wins = [0, 0], phase = 'intro', phaseT = 0, timer = 0, opp = null;
let totals = { parry:0, ripo:0, rounds:0, continues:0 };
let showHelp = true;
const MENU = ['무사수행 (CPU 연전)', '수련장 (패리 연습)', '대결 (2P · 키보드)', '조작법'];

function startMatch() {
  round = 1; wins = [0, 0]; startRound();
}
function startRound() {
  const op = mode === 'practice' ? DUMMY : mode === 'vs' ? null : OPPONENTS[stage];
  opp = op;
  p1 = new Fighter(W / 2 - 60, 1, PLAYER_PAL, 1);
  p2 = new Fighter(W / 2 + 60, -1, op ? op.pal : P2_PAL, op ? op.speed : 1);
  ai2 = op ? new AI(op) : null;
  phase = 'intro'; phaseT = 0; timer = ROUND_TIME * 60;
  parts = []; popups = [];
}
function endRound(winner) {
  if (winner >= 0) wins[winner]++;
  phase = 'ko'; phaseT = 0;
}

function update() {
  frame++;
  // 꽃잎
  for (const p of petals) { p.x += p.vx + Math.sin(frame * 0.02 + p.ph) * 0.2; p.y += p.vy; if (p.y > H) { p.y = -2; p.x = rnd(0, W + 40); } if (p.x < -4) p.x = W + 2; }

  if (scene === 'title') {
    if (tapAt) { const i = Math.floor((tapAt.y - 106) / 16); if (i >= 0 && i < MENU.length) menuIdx = i; else tapAt = null; }
    if (menuUp()) { menuIdx = (menuIdx + MENU.length - 1) % MENU.length; SFX.select(); }
    if (menuDown()) { menuIdx = (menuIdx + 1) % MENU.length; SFX.select(); }
    if (menuOk()) {
      SFX.go();
      if (menuIdx === 0) { mode = 'story'; stage = 0; totals = { parry:0, ripo:0, rounds:0, continues:0 }; scene = 'card'; }
      if (menuIdx === 1) { mode = 'practice'; scene = 'fight'; startMatch(); }
      if (menuIdx === 2) { mode = 'vs'; scene = 'fight'; startMatch(); }
      if (menuIdx === 3) scene = 'help';
    }
    return;
  }
  if (scene === 'help') { if (menuOk() || menuBack()) scene = 'title'; return; }
  if (scene === 'card') {
    if (menuOk()) { SFX.go(); scene = 'fight'; startMatch(); }
    if (menuBack()) scene = 'title';
    return;
  }
  if (scene === 'result' || scene === 'ending') {
    if (menuOk()) {
      SFX.select();
      if (scene === 'ending') { scene = 'title'; return; }
      if (wins[0] >= 2) { stage++; scene = stage >= OPPONENTS.length ? 'ending' : 'card'; }
      else { totals.continues++; scene = 'card'; }
    }
    if (menuBack()) scene = 'title';
    return;
  }
  // ---- fight
  if (menuBack()) { scene = 'title'; return; }
  if (pressed.KeyH && mode !== 'vs') showHelp = !showHelp;
  if (hitstop > 0) { hitstop--; return; }
  if (slowmo > 0) { slowmo--; if (slowmo % 3) { stepFx(); return; } }
  phaseT++;
  const idle = { fwd:0, back:0, down:0, guard:0, guardP:0, lightP:0, heavyP:0, dodgeP:0 };
  let i1 = idle, i2 = idle;
  if (phase === 'fight') {
    i1 = readHuman(mode === 'vs' ? KEYMAP_VS1 : KEYMAP_1P, p1);
    i2 = mode === 'vs' ? readHuman(KEYMAP_VS2, p2) : ai2.think(p2, p1);
    if (mode !== 'practice') timer--;
  }
  p1.update(i1); p2.update(i2);
  // 마주보기, 겹침 방지, 경계
  if (p1.canAct() || p1.state === 'windup') p1.dir = p2.x > p1.x ? 1 : -1;
  if (p2.canAct() || p2.state === 'windup') p2.dir = p1.x > p2.x ? 1 : -1;
  const minD = 16, dx = p2.x - p1.x;
  if (Math.abs(dx) < minD) { const push = (minD - Math.abs(dx)) / 2 * Math.sign(dx || 1); p1.x -= push; p2.x += push; }
  for (const f of [p1, p2]) f.x = clamp(f.x, 14, W - 14);
  if (phase === 'fight') { resolve(p1, p2); resolve(p2, p1); }

  if (mode === 'practice') {
    if (p2.hp < 100 && p2.state !== 'dead' && frame % 4 === 0) p2.hp++;
    if (p1.hp < 100 && p1.state !== 'dead' && frame % 4 === 0) p1.hp++;
    if (p2.state === 'dead' && phaseT > 0) { p2.hp = 100; p2.set('idle'); }
    if (p1.state === 'dead') { p1.hp = 100; p1.set('idle'); }
  }

  if (phase === 'intro' && phaseT === 1) SFX.select();
  if (phase === 'intro' && phaseT > 100) { phase = 'fight'; phaseT = 0; SFX.go(); }
  if (phase === 'fight' && mode !== 'practice') {
    if (p1.state === 'dead' || p2.state === 'dead') endRound(p1.state === 'dead' ? (p2.state === 'dead' ? -1 : 1) : 0);
    else if (timer <= 0) { endRound(p1.hp === p2.hp ? -1 : p1.hp > p2.hp ? 0 : 1); SFX.gong(); }
  }
  if (phase === 'ko' && phaseT > 150) {
    totals.parry += p1.stats.parry; totals.ripo += p1.stats.ripo; totals.rounds++;
    if (wins[0] >= 2 || wins[1] >= 2) {
      if (mode === 'vs') { scene = 'result'; }
      else scene = 'result';
    } else { round++; const w = wins.slice(); startRound(); wins = w; }
  }
  stepFx();
}
function stepFx() {
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--; }
  parts = parts.filter(p => p.life > 0);
  for (const p of popups) { p.y -= 0.35; p.life--; }
  popups = popups.filter(p => p.life > 0);
  if (shake > 0) shake *= 0.85; if (shake < 0.3) shake = 0;
  if (flashScreen > 0) flashScreen--;
}

// ---------------------------------------------------------------- 그리기
function drawPetals(col) { for (const p of petals) { g.fillStyle = col; g.fillRect(Math.round(p.x), Math.round(p.y), 2, 1); } }
function bar(x, y, w, h, v, col, back = '#1b1b24', rtl = false) {
  px(x - 1, y - 1, w + 2, h + 2, '#000'); px(x, y, w, h, back);
  const ww = Math.round(w * clamp(v, 0, 1));
  px(rtl ? x + w - ww : x, y, ww, h, col);
  px(rtl ? x + w - ww : x, y, ww, 1, 'rgba(255,255,255,0.35)');
}
function petalColor() { const i = opp ? opp.sky : 2; return i === 5 ? '#ff8a8a' : i === 4 ? '#e8a040' : '#f6c6d6'; }

function render() {
  document.body.classList.toggle('fighting', scene === 'fight');
  const sky = scene === 'fight' && opp ? opp.sky : scene === 'card' ? OPPONENTS[Math.min(stage, 6)].sky : 6;
  g.drawImage(makeBg(sky), 0, 0);
  if (scene === 'fight') {
    for (const f of [p1, p2].sort((a, b) => (a.state === 'dead') - (b.state === 'dead'))) drawFighter(f);
    for (const p of parts) px(p.x, p.y, p.life > 14 ? 2 : 1, p.life > 14 ? 2 : 1, p.col);
  }
  drawPetals(petalColor());
  if (flashScreen > 0) { g.fillStyle = `rgba(255,250,220,${flashScreen / 14})`; g.fillRect(0, 0, W, H); }
  if (scene !== 'fight') { g.fillStyle = 'rgba(5,5,12,0.55)'; g.fillRect(0, 0, W, H); }
  if (scene === 'fight') drawHudBars();

  // 저해상도 → 화면
  const sx = shake ? rnd(-shake, shake) * S : 0, sy = shake ? rnd(-shake, shake) * S : 0;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(buf, 0, 0, W, H, Math.round(sx), Math.round(sy), cv.width, cv.height);

  if (scene === 'title') drawTitle();
  else if (scene === 'help') drawHelp();
  else if (scene === 'card') drawCard();
  else if (scene === 'fight') drawHudText();
  else if (scene === 'result') drawResult();
  else if (scene === 'ending') drawEnding();
}
function drawHudBars() {
  bar(10, 10, 150, 7, p1.hp / 100, p1.hp > 30 ? '#e74c3c' : '#ff2d2d');
  bar(W - 160, 10, 150, 7, p2.hp / 100, p2.hp > 30 ? '#e74c3c' : '#ff2d2d', '#1b1b24', true);
  bar(10, 20, 100, 3, p1.ki / 100, p1.ki < 25 ? '#e67e22' : '#5dade2');
  bar(W - 110, 20, 100, 3, p2.ki / 100, p2.ki < 25 ? '#e67e22' : '#5dade2', '#1b1b24', true);
  for (let i = 0; i < 2; i++) {
    px(166 + i * 7, 12, 5, 5, wins[0] > i ? '#ffd84a' : '#333');
    px(W - 171 - i * 7, 12, 5, 5, wins[1] > i ? '#ffd84a' : '#333');
  }
}
function drawHudText() {
  const n2 = mode === 'vs' ? '2P' : opp.name;
  text(mode === 'vs' ? '1P' : '나그네', 10, 25, 7, '#e8e2d0');
  text(n2, W - 10, 25, 7, '#e8e2d0', 'right');
  if (mode !== 'practice') text(String(Math.max(0, Math.ceil(timer / 60))), W / 2, 6, 13, '#ffe9b0', 'center');
  else text('수련장', W / 2, 7, 9, '#ffe9b0', 'center');
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life / 20);
    text(p.str, p.x, p.y, p.size, p.col, 'center');
    ctx.globalAlpha = 1;
  }
  for (const f of [p1, p2]) if (f.feintFx) text('페인트', f.x, GROUND - 52, 7, '#c39bd3', 'center');
  if (p1.ripo > 0) text('되치기 기회!', p1.x, GROUND - 60, 7, '#ffd84a', 'center');
  if (mode !== 'vs' && p2.ripo > 0) text('위험!', p2.x, GROUND - 60, 7, '#ff6b6b', 'center');

  if (phase === 'intro') {
    const label = mode === 'practice' ? '수련 시작' : phaseT < 60 ? `제 ${round} 합` : '승부!';
    const sz = phaseT < 60 ? 18 : 24;
    text(label, W / 2, H / 2 - 30, sz, phaseT < 60 ? '#e8e2d0' : '#ff5e57', 'center');
  }
  if (phase === 'ko') {
    const dead1 = p1.state === 'dead', dead2 = p2.state === 'dead';
    let label = '일 격 필 살';
    if (!dead1 && !dead2) label = '시간 종료';
    text(label, W / 2, H / 2 - 36, 20, '#ff5e57', 'center');
    if (phaseT > 60) {
      const w = (dead1 && dead2) || (!dead1 && !dead2 && p1.hp === p2.hp) ? '무승부' :
        (dead2 || (!dead1 && p1.hp > p2.hp)) ? (mode === 'vs' ? '1P 승리' : '승리') : (mode === 'vs' ? '2P 승리' : '패배');
      text(w, W / 2, H / 2 - 10, 12, '#e8e2d0', 'center');
    }
  }
  if (showHelp && mode !== 'vs' && IS_TOUCH && phase !== 'fight') {
    text('하단 버튼을 누른 채 베기/강타/막기 = 하단 · 맞기 직전 막기 = 받아넘기기', W / 2, H - 40, 6, '#d8d2c0', 'center');
  } else if (showHelp && mode !== 'vs' && !IS_TOUCH) {
    const y = H - 22;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, y * S - 2 * S, cv.width, 24 * S);
    text('A/D 이동 · S누르고=하단 · J 베기 · K 강타 · L 막기(맞기 직전=받아넘기기) · Space 회피', W / 2, y, 6, '#d8d2c0', 'center', null);
    text('강타 준비 중 L = 페인트 · 받아넘긴 직후 공격 = 되치기 일섬(2.2배) · H 도움말 · Esc 메뉴', W / 2, y + 9, 6, '#a8a290', 'center', null);
  }
}
function drawTitle() {
  text('月 下 劍 客', W / 2, 30, 12, '#c9b98a', 'center');
  text('월하검객', W / 2, 44, 32, '#f4efd8', 'center');
  text('막고, 받아넘기고, 단 한 번에 벤다', W / 2, 84, 8, '#c9b98a', 'center');
  MENU.forEach((m, i) => {
    const sel = i === menuIdx;
    text((sel ? '▶ ' : '   ') + m, W / 2 - 62, 110 + i * 16, 9, sel ? '#ffd84a' : '#a8a290');
  });
  text(IS_TOUCH ? '메뉴를 탭하세요 · 가로 화면 권장' : '↑↓ 선택 · Enter / J 확인', W / 2, H - 16, 6, '#7f7a6a', 'center');
}
function drawHelp() {
  const L = [
    ['이동', 'A / D  (← →)'], ['베기 (빠름)', 'J  — S를 누른 채면 하단 베기'], ['강타 (느림·가드 기력 크게 깎음)', 'K  — 칼이 붉게 번쩍이면 곧 들어온다'],
    ['막기', 'L 누르고 있기 — S를 함께 누르면 하단 막기'], ['받아넘기기 (패리)', '공격이 닿기 직전(약 0.1초)에 L을 눌러라'],
    ['되치기 일섬', '받아넘긴 직후 1초 안에 공격 → 2.2배 피해'], ['페인트', '강타 준비 중 L → 동작 취소, 상대의 패리를 낚아라'],
    ['회피', 'Space — 뒤로 물러서며 잠깐 무적'], ['기력', '공격/회피/막기에 소모. 바닥나면 가드 붕괴'],
    ['터치', '왼손: ◀ ▶ 하단 회피 / 오른손: 베기 강타 막기'], ['2P 대결', '1P: A D S / F G H / W회피   2P: ← → ↓ / , . / / ↑회피'],
  ];
  text('조 작 법', W / 2, 12, 14, '#f4efd8', 'center');
  L.forEach(([a, b], i) => { text(a, 30, 36 + i * 14, 7, '#ffd84a'); text(b, 150, 36 + i * 14, 7, '#e8e2d0'); });
  text('막기 연타는 받아넘기기가 되지 않는다. 읽고, 기다려라.', W / 2, H - 16, 7, '#c9b98a', 'center');
}
function drawCard() {
  const o = OPPONENTS[stage];
  text(`제 ${stage + 1} 관문  /  ${OPPONENTS.length}`, W / 2, 26, 9, '#c9b98a', 'center');
  text(o.title, W / 2, 52, 9, '#a8a290', 'center');
  text(o.name, W / 2, 66, 30, '#f4efd8', 'center');
  text(`“${o.quote}”`, W / 2, 112, 8, '#e8e2d0', 'center');
  const lv = Math.round((o.react < 15 ? 3 : o.react < 22 ? 2 : 1) + o.parry * 4);
  text('실력  ' + '◆'.repeat(Math.min(5, lv + 1)) + '◇'.repeat(Math.max(0, 4 - lv)), W / 2, 134, 8, '#ffd84a', 'center');
  if (o.adapt) text('※ 이 상대는 당신의 공격 습관(상단/하단)을 기억한다', W / 2, 150, 7, '#ff8a8a', 'center');
  if (totals.continues) text(`재도전 ${totals.continues}회`, W / 2, 166, 6, '#7f7a6a', 'center');
  text(IS_TOUCH ? '화면을 탭하면 결투 시작' : 'Enter / J  결투 시작   ·   Esc 메뉴', W / 2, H - 18, 7, '#7f7a6a', 'center');
}
function drawResult() {
  const won = wins[0] >= 2;
  if (mode === 'vs') {
    text(won ? '1P 승리' : '2P 승리', W / 2, 60, 24, '#f4efd8', 'center');
    text('Enter 다시 · Esc 메뉴', W / 2, H - 20, 7, '#7f7a6a', 'center');
    if (menuOk()) {} return;
  }
  text(won ? '승 리' : '패 배', W / 2, 40, 26, won ? '#ffd84a' : '#ff5e57', 'center');
  text(won ? `${opp.name}: "……훌륭한 칼이었다."` : `${opp.name}: "아직 멀었다."`, W / 2, 84, 8, '#e8e2d0', 'center');
  text(`받아넘기기 ${p1.stats.parry}회 · 되치기 일섬 ${p1.stats.ripo}회 · 페인트 ${p1.stats.feints}회`, W / 2, 110, 7, '#c9b98a', 'center');
  text(won ? (stage + 1 >= OPPONENTS.length ? 'Enter  마지막 장으로' : 'Enter  다음 상대') : 'Enter  재도전 · Esc 메뉴', W / 2, H - 22, 8, '#a8a290', 'center');
}
function drawEnding() {
  text('검 성 등 극', W / 2, 36, 22, '#ffd84a', 'center');
  text('달빛 아래, 더는 칼을 겨눌 자가 없었다.', W / 2, 74, 8, '#e8e2d0', 'center');
  text(`총 받아넘기기 ${totals.parry}회 · 되치기 일섬 ${totals.ripo}회 · 재도전 ${totals.continues}회`, W / 2, 100, 7, '#c9b98a', 'center');
  const rank = totals.continues === 0 && totals.ripo >= 10 ? '천하제일검' : totals.continues <= 2 ? '일류 검객' : totals.continues <= 6 ? '이류 검객' : '불굴의 나그네';
  text('칭호: ' + rank, W / 2, 124, 12, '#f4efd8', 'center');
  text('Enter  처음으로', W / 2, H - 20, 7, '#7f7a6a', 'center');
}

// ---------------------------------------------------------------- 루프 (고정 60fps)
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) {
    if (scene === 'result' && mode === 'vs' && menuOk()) { SFX.go(); scene = 'fight'; startMatch(); }
    update();
    for (const k in pressed) delete pressed[k];
    for (const k in touchPressed) delete touchPressed[k];
    tapAt = null;
    acc -= 1000 / 60;
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// 테스트용 훅
window.__game = { get p1() { return p1; }, get p2() { return p2; }, get scene() { return scene; }, get phase() { return phase; } };
</script>
</body>
</html>
